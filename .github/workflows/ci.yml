name: CI
# T0.3: unit + acceptance gate on every push/PR. Lint and strict-type jobs
# report the hardening baseline; they become blocking once their baselines
# reach zero (see STATE.md). Tests are always blocking.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (locked env + dev tools)
        run: |
          pip install uv
          uv sync --locked --extra dev || pip install -e ".[dev]"
      - name: Unit tests
        run: uv run --locked pytest tests/unit -q || .venv/bin/pytest tests/unit -q
      - name: Acceptance tests
        run: uv run --locked pytest tests/acceptance -q || .venv/bin/pytest tests/acceptance -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff (baseline reported, blocking once zero)
        continue-on-error: true
        run: ruff check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Mypy strict on risk/execution/adapters/app (baseline reported)
        continue-on-error: true
        run: mypy
