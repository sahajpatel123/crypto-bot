name: CI
# T0.3: unit + acceptance gate on every push/PR. Lint and strict-type jobs
# report the hardening baseline; they become blocking once their baselines
# reach zero (see STATE.md). Tests are always blocking.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Measured: unit ~21 min, acceptance ~1 min. Headroom for a slow runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (locked env + dev tools)
        # Blocking: a corrupt uv.lock must fail here, not be papered over by
        # an unlocked fallback install (the defect this branch repairs).
        run: |
          pip install uv
          uv sync --locked --extra dev
      - name: Unit tests
        # Choose the interpreter once. The old `uv run ... || .venv/bin/pytest`
        # fired on a TEST failure too, re-running the whole 20-minute suite
        # and hiding the failing name behind a job timeout.
        run: |
          PYTEST=.venv/bin/pytest
          [ -x "$PYTEST" ] || PYTEST=pytest
          "$PYTEST" tests/unit -q
      - name: Acceptance tests
        run: |
          PYTEST=.venv/bin/pytest
          [ -x "$PYTEST" ] || PYTEST=pytest
          "$PYTEST" tests/acceptance -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.1  # pinned: lint is blocking
      - name: Ruff (blocking; baseline reached zero)
        run: ruff check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Mypy strict on risk/execution/adapters/app (baseline reported)
        continue-on-error: true
        run: mypy
