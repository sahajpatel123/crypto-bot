# Bot v0.1 PROD configuration (W3-30MIN §9): explicit production path.
#
# Observe-only unless the operator explicitly enables submission:
# allow_live_submission defaults to false AND the preflight tool
# (tools/preflight.py) gates real runs. API credentials NEVER live here:
# set api_key_ref to an env label and export CRYPTOBOT_API_KEY /
# CRYPTOBOT_API_SECRET in the process environment only.
# Ledger currency is USDT. Asia/Kolkata accounting day.
#
# WARNING (T0.4 truth-in-docs; fix is T1.1): paper_capital_usdt is NOT
# venue equity, but Session currently seeds Ledger + day-start equity from
# it even in prod mode (src/cryptobot/app/session.py: Ledger(
# config.paper_capital_usdt)). Do NOT treat 120.0 as live capital. T1.1
# makes venue equity the only seed for demo/prod and restricts this field
# to paper/replay. Until T1.1 lands, prod mode is accounting-unsafe.

[run]
mode = "prod"                # prod = live USD-M via engine.kind = "live"
paper_capital_usdt = 120.0   # REQUIRED placeholder; NOT live equity (see WARNING)
accounting_tz = "Asia/Kolkata"
duration = "24h"

[risk]
max_loss_budget_pct = 0.00125
leverage_cap = 3.0
min_notional_usdt = 5.0
stress_multiplier = 1.5
operating_stop_pct = 0.005
emergency_stop_pct = 0.01
profile_version = "24h-1"
max_mark_age_ms = 1000  # §4: 1s maximum quote/valuation age
daily_target_pct = 0.02
profit_arm_pct = 0.01
profit_retain_pct = 0.70
max_evidence_age_s = 120.0
max_clock_skew_s = 5.0
filters_max_age_s = 3600.0
max_notional_cap_usdt = 500.0

[fees]
label = "venue-actual-unknown"
taker_bps = 5.0
funding_bps_per_8h = 1.0

[engine]
kind = "live"                # prod requires kind = "live"
demo = false                 # prod forbids demo (demo is paper-live)
base_url = "https://fapi.binance.com"
submit_delay_ms = 0
fill_delay_ms = 0
allow_live_submission = false  # §9: default-off at every layer.
# api_key_ref unset: operator sets an env label when enabling submission.

[data]
symbols = ["BTCUSDT"]
max_symbols = 8
max_hf_subscriptions = 2  # REL-W3: prior data did not support eight.
warmup_bars = 130

[runtime]
control_tick_s = 0.25  # §4: 250ms control tick target
feed_queue_max = 1000  # §4: bounded feed queue (drop-oldest + counter)
quote_max_age_s = 1.0  # §4: 1s quote/valuation age gate for entries

[storage]
dir = "runs"
budget_mb = 2048

[strategies]
enabled = ["S1", "S2", "S3", "S4", "S5"]
arms = "base"
cooldown_s = 300
min_reward_multiple = 1.0
allow_legacy_exit_rules = false
