# SC research replay. Simulation only. Live submission is not a key here.
# Rules: specs/strategies/SC.md v0.1.0, frozen before measurement.

[run]
mode = "replay"
paper_capital_usdt = 120.0
accounting_tz = "Asia/Kolkata"
