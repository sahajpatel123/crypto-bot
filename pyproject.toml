[project]
name = "crypto-scalping-bot"
version = "0.1.0"
description = "Binance USDT-perpetual scalping research and simulation system (replay-first, no live orders)"
requires-python = ">=3.12"
dependencies = [
    "nautilus-trader==1.231.0",
    "pyarrow==26.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cryptobot = "cryptobot.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
