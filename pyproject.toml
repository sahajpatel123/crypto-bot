[project]
name = "crypto-scalping-bot"
version = "0.1.0"
description = "Binance USDT-perpetual scalping research and simulation system (replay-first, no live orders)"
requires-python = ">=3.12"
dependencies = [
    "nautilus-trader==1.231.0",
    "pyarrow==26.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
cryptobot = "cryptobot.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# T0.3: lint + type gates. Ruff applies everywhere; mypy is strict ONLY on
# the money-handling packages (risk/, execution/, adapters/, app/) per the
# hardening plan — other packages stay at the lenient base until they are
# cleaned up. Do not weaken these to go green; fix code or record a
# justified exception in DECISIONS.md.
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length handled by formatter-era code; keep gate on logic
    "SIM102",  # nested ifs here carry a guard comment between the conditions
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["cryptobot"]
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["cryptobot.risk.*", "cryptobot.execution.*",
          "cryptobot.adapters.*", "cryptobot.app.*"]
strict = true
# NautilusTrader ships no py.typed in the pinned build; strict must not
# drown in third-party stub noise.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cryptobot.*"]
ignore_missing_imports = true
check_untyped_defs = false
